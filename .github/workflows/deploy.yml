# main 브랜치에 push하면 FTP 서버로 홈페이지를 자동 업로드합니다.
# 필요한 저장소 Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (선택) FTP_SERVER_DIR: 서버의 홈페이지 폴더. 없으면 www/ (카페24 기본)
name: FTP 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP 접속 정보 확인
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=""
          for n in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않았거나 비어 있는 Secrets:$missing"
            exit 1
          fi
          # 앞뒤 공백·줄바꿈, ftp:// 접두어, 뒤쪽 경로 등 잘못 붙은 문자 정리
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | head -n 1; }
          FTP_SERVER=$(trim "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#[/[:space:]].*$##')
          FTP_USERNAME=$(trim "$FTP_USERNAME")
          FTP_PASSWORD=$(trim "$FTP_PASSWORD")
          echo "::add-mask::$FTP_PASSWORD"
          dir=$(trim "${FTP_SERVER_DIR:-www}")
          dir="${dir#/}"
          dir="${dir%/}/"
          echo "업로드 폴더: $dir"
          {
            echo "server=$FTP_SERVER"
            echo "username=$FTP_USERNAME"
            echo "password=$FTP_PASSWORD"
            echo "dir=$dir"
          } >> "$GITHUB_OUTPUT"

      - name: FTP 업로드
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ steps.ftp.outputs.username }}
          password: ${{ steps.ftp.outputs.password }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          # data/, uploads/는 저장소에 .htaccess만 있으므로 서버의 실제 데이터는 건드리지 않음
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
